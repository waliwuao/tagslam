# Camera pose priors.
# The camera pose is unknown and will be estimated from tag observations.
# A weak identity prior is provided as initial guess.
cam0:
  pose:
    position:
      x: 0
      y: 0
      z: 0
    rotation:
      x: 0
      y: 0
      z: 0
    position_noise:
      x: 10.0
      y: 10.0
      z: 10.0
    rotation_noise:
      x: 1.0
      y: 1.0
      z: 1.0
