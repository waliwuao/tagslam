tagslam_parameters:
  # optimizer mode: full | slow (default) | fast
  optimizer_mode: slow
  # minimum angle [deg] between optical axis and tag surface
  minimum_viewing_angle: 15.0
  # ignore tags smaller than this area [pixels^2]
  minimum_tag_area: 2000
  # number of incremental updates before full graph optimization
  max_num_incremental_opt: 50
  # estimated error of tag corner detector [pixels]
  pixel_noise: 1.0
  # drop frames with subgraph error above this threshold
  max_subgraph_error: 50.0
  # subgraph absolute prior noise (usually leave as-is)
  subgraph_abs_prior_position_noise: 0.1
  subgraph_abs_prior_rotation_noise: 0.1
  # set to true if camera timestamps are not hardware-synced
  use_approximate_sync: false

body_defaults:
  position_noise: 0.05
  rotation_noise: 0.01

bodies:
  # Static body holding all known AprilTags.
  # Tag ID 0 is the world origin (0,0,0).
  - world:
      is_static: true
      default_tag_size: 0.12
      type: simple
      pose:
        position:
          x: 0
          y: 0
          z: 0
        rotation:
          x: 0
          y: 0
          z: 0
        position_noise:
          x: 0.0001
          y: 0.0001
          z: 0.0001
        rotation_noise:
          x: 1.0e-05
          y: 1.0e-05
          z: 1.0e-05
      tags:
        - id: 0
          size: 0.12
          pose:
            position:
              x: 0
              y: 0
              z: 0
            rotation:
              x: 0
              y: 0
              z: 0
            position_noise:
              x: 0.0001
              y: 0.0001
              z: 0.0001
            rotation_noise:
              x: 1.0e-05
              y: 1.0e-05
              z: 1.0e-05
        - id: 1
          size: 0.12
          pose:
            position:
              x: 0.5     # TODO: replace with actual measurement
              y: 0.0
              z: 0.0
            rotation:
              x: 0
              y: 0
              z: 0
            position_noise:
              x: 0.0001
              y: 0.0001
              z: 0.0001
            rotation_noise:
              x: 1.0e-05
              y: 1.0e-05
              z: 1.0e-05
        - id: 2
          size: 0.12
          pose:
            position:
              x: 0.0     # TODO: replace with actual measurement
              y: 0.5
              z: 0.0
            rotation:
              x: 0
              y: 0
              z: 0
            position_noise:
              x: 0.0001
              y: 0.0001
              z: 0.0001
            rotation_noise:
              x: 1.0e-05
              y: 1.0e-05
              z: 1.0e-05

  # Camera rig: camera is mounted on this body.
  # No odometry → pose estimated purely from tag observations.
  - camera_rig:
      is_static: false
      type: simple
